  <text x="48" y="252" font-family="Segoe UI, system-ui, sans-serif" font-size="12" fill="#6C7A8C">Иконка, процент и состояние читаются без наведения. Молния пульсирует, пока идёт зарядка. Порог, положение и размер иконки — в правом клике.</text>
